<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedratech | Template</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <!-- INSERT PAGE CONTENT HERE -->

    <section class="contact-section">
        <div class="contact-content">
            <span class="eyebrow">CONTACT US</span>
            <h2>Let's build something resilient together.</h2>
            <p>We welcome conversations with institutions, regulators, fintechs, and programs ready to advance their digital-finance agenda. Reach out and we will respond promptly.</p>
            <a href="contact.html" class="contact-cta">Contact Us</a>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <button onclick="scrollToTop()" id="backToTop" title="Go to top">↑</button>

    <script>
        // 1. Load the header dynamically, then highlight the active page
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;

                let path = window.location.pathname;
                let page = path.split("/").pop();
                if (page === "" || page === "/") {
                    page = "index.html";
                }

                const navItems = document.querySelectorAll('#nav-menu .nav-item, #nav-menu .dropdown-item');
                navItems.forEach(item => {
                    if (item.getAttribute('data-page') === page) {
                        item.classList.add('active');
                    }
                });
            });

        // 2. Load the footer dynamically
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });

        // Your existing toggle and helper functions
        function toggleMenu() {
            document.getElementById('nav-menu').classList.toggle('active');
        }

        function toggleDropdown(event) {
            if (window.innerWidth <= 1100) {
                event.preventDefault();
                const dropdown = document.getElementById('services-dropdown');
                dropdown.classList.toggle('open');
            }
        }

        document.addEventListener('click', function(event) {
            const nav = document.getElementById('nav-menu');
            const toggle = document.querySelector('.menu-toggle');
            if (nav && toggle && !nav.contains(event.target) && !toggle.contains(event.target)) {
                nav.classList.remove('active');
            }
        });

        const backToTopButton = document.getElementById("backToTop");
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                backToTopButton.style.display = "flex";
            } else {
                backToTopButton.style.display = "none";
            }
        };

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
